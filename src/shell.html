<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="pose-index-mode" content="__GALLERY_MODE__">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob: file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="姿态索引：完整看图、多视角对照、收藏集合与离线参考台。所有图片与个人记录留在本机。"><title>姿态索引 · 离线参考图库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23234236'/%3E%3Ctext x='5' y='24' fill='%23c8f0ad' font-size='24'%3EP%3C/text%3E%3C/svg%3E"><style>/*__STYLE__*/</style></head><body>
<div id="app" class="app"><aside class="sidebar" aria-label="图库导航">
<a class="brand" href="#"><span class="brand-mark">姿</span><span><b>姿态索引</b><small>中文姿势参考图库</small></span></a>
<div class="side-label">我的图库 <span id="librarySize"></span></div>
<nav id="libraryNav" class="nav-stack" aria-label="浏览范围"><button data-scope="all" class="nav-item">全部姿势 <span>↗</span></button><button data-scope="fav" class="nav-item">我的收藏 <span id="favCount">0</span></button><button data-scope="recent" class="nav-item">最近浏览 <span id="recentCount">0</span></button></nav>
<div class="side-label">参考集合 <button id="newCollection" class="icon-btn" aria-label="新建集合">＋</button></div><nav id="collections" class="nav-stack" aria-label="参考集合"></nav>
<div class="side-label">素材系列</div><nav id="series" class="nav-stack" aria-label="素材系列"></nav>
<div class="side-bottom"><button id="backupBtn" class="text-btn">导出个人资料</button><label class="text-btn import-label">导入个人资料<input id="importInput" type="file" accept=".json,application/json" hidden></label><a class="repo-link" href="https://github.com/1581610/ai-pose-gallery-offline-zh" target="_blank" rel="noopener noreferrer">GitHub 仓库 <span aria-hidden="true">↗</span></a></div></aside>
<main class="workspace"><header class="topbar"><span class="breadcrumb">姿态索引 <span>/</span> 中文姿势图库</span><div class="top-actions"><a class="source-link" href="https://ai-pose-gallery.pages.dev/" target="_blank" rel="noopener noreferrer" aria-label="访问素材原站">素材原站 <span>↗</span></a><button id="boardBtn" class="btn">参考台 <span id="boardCount">0 / 4</span></button><button id="themeBtn" class="icon-btn" aria-label="切换浅深色主题" title="切换浅深色主题">◐</button><button id="helpBtn" class="btn" aria-label="使用帮助">帮助</button></div></header>
<section class="intro" aria-labelledby="pageTitle"><div class="intro-copy"><p id="pageKicker" class="intro-kicker">POSE REFERENCE</p><h1 id="pageTitle">姿势参考</h1><p id="pageSubtitle" class="intro-subtitle">观察形体，寻找构图。</p></div><dl class="library-stats" aria-label="全库素材总量"><div><dt>组姿势</dt><dd id="poseTotal">—</dd></div><div><dt>张原图</dt><dd id="imageTotal">—</dd></div></dl></section>
<section class="controls" aria-label="搜索与筛选"><div class="search-row"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索姿势" maxlength="500" placeholder="搜索动作或编号，如：坐姿 侧面" autocomplete="off"><kbd>/</kbd></label><button id="filtersToggle" class="btn" aria-expanded="false" aria-controls="filters">筛选</button></div>
<div id="filters" class="filter-row"><label>动作分类 <select id="category"><option value="">全部分类</option></select></label><label>视角 <select id="angle"><option value="">全部视角</option></select></label><label>排序 <select id="sort"><option value="source">素材顺序</option><option value="name">名称顺序</option></select></label><button id="resetBtn" class="text-btn">重置筛选</button><label class="check-label"><input id="showJa" type="checkbox">日文原名</label></div><div id="activeFilters" class="active-filters" aria-label="已选筛选条件"></div></section>
<section class="result-toolbar" aria-label="视图选项"><div><b id="resultCount" aria-live="polite"></b><span id="shownCount" class="muted"></span></div><div class="view-actions"><div id="modes" class="segmented" aria-label="浏览模式"><button data-mode="pose">按姿势</button><button data-mode="single">单图</button><button data-mode="compare">五视角</button></div><label class="density">大小 <input id="density" type="range" min="155" max="295" step="10" value="215" aria-label="卡片大小"></label></div></section>
<div id="selectionBar" class="selection-bar" hidden><b id="selectionCount"></b><button id="selectVisible" class="text-btn">选择已显示</button><button id="selectionCollection" class="btn">加入集合</button><button id="selectionCsv" class="btn">导出所选 CSV</button><button id="selectionClear" class="text-btn">取消选择</button></div>
<div id="collectionActions" class="collection-actions" hidden><button id="renameCollection" class="text-btn">重命名集合</button><button id="removeFromCollection" class="text-btn">移出所选图片</button><button id="deleteCollection" class="text-btn">删除集合</button></div>
<section id="grid" class="grid" aria-label="姿势图片"></section><div class="load-area"><button id="loadMore" class="btn load-more">继续浏览</button><span id="endLabel" class="muted" hidden>已显示全部结果</span></div>
<footer class="footer"><span>POSE INDEX · 本机离线图库</span><div><button id="exportCsv" class="text-btn">导出筛选结果 CSV</button><button id="copyPaths" class="text-btn">复制图片路径</button><button id="backTop" class="text-btn">回到顶部 ↑</button></div></footer></main></div>
<dialog id="viewer" class="viewer" aria-label="完整图片预览"><div class="viewer-layout"><section id="stage" class="stage" aria-label="图片，放大后可拖动"><img id="fullImage" alt="" draggable="true"><div id="imageStatus" class="image-status" role="status"></div><div class="stage-top"><span id="viewerPosition"></span><span class="drag-hint">直接拖出原图 · 放大后 Alt＋拖动</span><button id="closeViewer" class="round-btn" aria-label="关闭预览">×</button></div><div class="stage-tools"><button id="prevAngle" class="round-btn" aria-label="上一视角">←</button><button id="zoomOut" class="round-btn" aria-label="缩小">−</button><button id="fitImage" class="pill-btn">适应窗口</button><button id="zoomIn" class="round-btn" aria-label="放大">＋</button><button id="mirrorImage" class="pill-btn" aria-pressed="false">镜像</button><button id="prevPose" class="round-btn" aria-label="上一姿势">↑</button><button id="nextPose" class="round-btn" aria-label="下一姿势">↓</button><button id="nextAngle" class="round-btn" aria-label="下一视角">→</button></div></section><aside class="viewer-info"><p class="eyebrow" id="viewerNumber"></p><h2 id="viewerTitle"></h2><p id="viewerJa" class="muted"></p><div id="viewerAngles" class="viewer-angles"></div><div class="prompt-box"><div class="prompt-head"><span>姿态提示词 · 英文</span><button id="copyPrompt" class="text-btn" type="button">复制提示词</button></div><p id="posePrompt" class="prompt-en" lang="en"></p><label class="prompt-view"><input id="withAngle" type="checkbox"> 复制时带上视角前缀 <b id="anglePrefix"></b></label></div><dl id="viewerMeta" class="metadata"></dl><div class="viewer-buttons"><button id="favPose" class="btn">收藏姿势</button><button id="favImage" class="btn">收藏此图</button><button id="pinImage" class="btn">放入参考台</button><button id="addCollection" class="btn">加入集合</button><a id="downloadImage" class="btn primary" download>保存原图</a></div><label class="note-label">此姿势的备注<textarea id="poseNote" rows="3" maxlength="3000" placeholder="构图、动作要点、使用计划…"></textarea></label><p class="keyboard-note">← → 换视角 · ↑ ↓ 换姿势<br>滚轮缩放 · 放大后拖动平移<br>空格：适应 / 原尺寸 · Alt＋拖动：拖出原图<br>F 收藏姿势 · Esc 关闭</p></aside></div></dialog>
<dialog id="boardDialog" class="board-dialog" aria-labelledby="boardTitle"><header><div><p class="eyebrow">REFERENCE DESK</p><h2 id="boardTitle">参考台</h2></div><div><button id="clearBoard" class="text-btn">清空</button><button id="closeBoard" class="icon-btn" aria-label="关闭参考台">×</button></div></header><div id="boardGrid" class="board-grid"></div><p class="muted">最多固定 4 张图片；镜像仅改变显示，不修改原文件。</p></dialog>
<dialog id="smallDialog" class="small-dialog"><form method="dialog" id="dialogForm"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions"><button id="dialogCancel" type="button" value="cancel" class="btn">取消</button><button id="dialogConfirm" type="submit" value="ok" class="btn primary">确定</button></div></form></dialog>
<div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div><script id="poseData" type="application/json">/*__DATA__*/</script><script id="promptData" type="application/json">/*__PROMPTS__*/</script><script>/*__APP__*/</script></body></html>
